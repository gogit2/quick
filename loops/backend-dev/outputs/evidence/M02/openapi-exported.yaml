openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8091
  description: Generated server url
paths:
  /api/tasks/{id}:
    get:
      tags:
      - Tasks
      summary: Get a task
      operationId: getTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Task
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
    put:
      tags:
      - Tasks
      summary: Update a task
      operationId: updateTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
        required: true
      responses:
        "200":
          description: Updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      tags:
      - Tasks
      summary: Delete a task for good
      description: Also removed from plans
      operationId: deleteTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted (also removed from plans)
        "404":
          description: Not found
  /api/settings:
    get:
      tags:
      - Settings
      summary: Get the settings of the single user
      operationId: getSettings
      responses:
        "200":
          description: Settings
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      tags:
      - Settings
      summary: Replace the settings
      description: Invalid time zone ids and unknown start pages are rejected with
        400.
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
        required: true
      responses:
        "200":
          description: Saved settings
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Settings"
  /api/tasks:
    get:
      tags:
      - Tasks
      summary: List tasks
      operationId: listTasks
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
      - name: priority
        in: query
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      - name: due
        in: query
        required: false
        schema:
          type: string
          enum:
          - TODAY
          - OVERDUE
          - THIS_WEEK
          - NO_DUE_DATE
      - name: dueFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: dueTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREATED_DESC
          - CREATED_ASC
          - DUE_DATE_ASC
          - DUE_DATE_DESC
      responses:
        "200":
          description: Tasks (not paginated)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      tags:
      - Tasks
      summary: Create a task
      description: "Defaults: status TODO, priority MEDIUM."
      operationId: createTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{id}/restore:
    post:
      tags:
      - Tasks
      summary: Restore an archived task
      operationId: restoreTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Updated task
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{id}/complete:
    post:
      tags:
      - Tasks
      summary: Mark a task completed (status DONE)
      operationId: completeTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Updated task
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{id}/archive:
    post:
      tags:
      - Tasks
      summary: Archive a task
      operationId: archiveTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Updated task
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
components:
  schemas:
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        status:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        dueDate:
          type: string
          format: date
      required:
      - title
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        dueDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archived:
          type: boolean
        overdue:
          type: boolean
    SettingsUpdate:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        timeZone:
          type: string
        notificationsEnabled:
          type: boolean
        defaultStartPage:
          type: string
          enum:
          - DASHBOARD
          - TASKS
          - HABITS
          - LEARNING
          - PLANS
    Settings:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        timeZone:
          type: string
        notificationsEnabled:
          type: boolean
        defaultStartPage:
          type: string
          enum:
          - DASHBOARD
          - TASKS
          - HABITS
          - LEARNING
          - PLANS
        configured:
          type: boolean
    TaskCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        status:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        dueDate:
          type: string
          format: date
      required:
      - title
