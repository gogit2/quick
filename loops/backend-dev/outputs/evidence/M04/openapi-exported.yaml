openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8091
  description: Generated server url
paths:
  /api/tasks/{id}:
    get:
      tags:
      - Tasks
      summary: Get a task
      operationId: getTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Task
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
    put:
      tags:
      - Tasks
      summary: Update a task
      operationId: updateTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
        required: true
      responses:
        "200":
          description: Updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      tags:
      - Tasks
      summary: Delete a task for good
      description: Also removed from plans
      operationId: deleteTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted (also removed from plans)
        "404":
          description: Not found
  /api/settings:
    get:
      tags:
      - Settings
      summary: Get the settings of the single user
      operationId: getSettings
      responses:
        "200":
          description: Settings
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      tags:
      - Settings
      summary: Replace the settings
      description: Invalid time zone ids and unknown start pages are rejected with
        400.
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
        required: true
      responses:
        "200":
          description: Saved settings
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Settings"
  /api/learning-cards/{id}:
    get:
      tags:
      - Learning
      summary: Get a learning card
      operationId: getLearningCard
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Card
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCard"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCard"
    put:
      tags:
      - Learning
      summary: Update a learning card
      description: A status is accepted only while the card has no milestones; otherwise
        409.
      operationId: updateLearningCard
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningCardUpdate"
        required: true
      responses:
        "200":
          description: Updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCard"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCard"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCard"
        "409":
          description: Status follows the milestones
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCard"
    delete:
      tags:
      - Learning
      summary: Remove a learning card with its milestones and notes
      description: Also removed from plans
      operationId: deleteLearningCard
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted (also removed from plans)
        "404":
          description: Not found
  /api/learning-cards/{id}/milestones/{milestoneId}:
    put:
      tags:
      - Learning
      summary: Update or complete a milestone
      operationId: updateLearningMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningMilestoneUpdate"
        required: true
      responses:
        "200":
          description: Updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningMilestone"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningMilestone"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningMilestone"
    delete:
      tags:
      - Learning
      summary: Remove a milestone
      operationId: deleteLearningMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /api/habits/{id}:
    get:
      tags:
      - Habits
      summary: Get a habit
      operationId: getHabit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Habit
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Habit"
    put:
      tags:
      - Habits
      summary: Update or (de)activate a habit
      operationId: updateHabit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
        required: true
      responses:
        "200":
          description: Updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Habit"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Habit"
    delete:
      tags:
      - Habits
      summary: Delete a habit and its completions
      description: Also removed from plans
      operationId: deleteHabit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted (also removed from plans)
        "404":
          description: Not found
  /api/tasks:
    get:
      tags:
      - Tasks
      summary: List tasks
      operationId: listTasks
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
      - name: priority
        in: query
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      - name: due
        in: query
        required: false
        schema:
          type: string
          enum:
          - TODAY
          - OVERDUE
          - THIS_WEEK
          - NO_DUE_DATE
      - name: dueFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: dueTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREATED_DESC
          - CREATED_ASC
          - DUE_DATE_ASC
          - DUE_DATE_DESC
      responses:
        "200":
          description: Tasks (not paginated)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      tags:
      - Tasks
      summary: Create a task
      description: "Defaults: status TODO, priority MEDIUM."
      operationId: createTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{id}/restore:
    post:
      tags:
      - Tasks
      summary: Restore an archived task
      operationId: restoreTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Updated task
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{id}/complete:
    post:
      tags:
      - Tasks
      summary: Mark a task completed (status DONE)
      operationId: completeTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Updated task
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{id}/archive:
    post:
      tags:
      - Tasks
      summary: Archive a task
      operationId: archiveTask
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Updated task
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Task"
  /api/learning-cards:
    get:
      tags:
      - Learning
      summary: List learning cards with milestones and notes
      operationId: listLearningCards
      responses:
        "200":
          description: "Cards, newest first"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningCard"
    post:
      tags:
      - Learning
      summary: Add a learning card
      operationId: createLearningCard
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningCardCreate"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCard"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningCard"
  /api/learning-cards/{id}/notes:
    post:
      tags:
      - Learning
      summary: Add a note to a card
      operationId: createLearningNote
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningNoteCreate"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningNote"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningNote"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningNote"
  /api/learning-cards/{id}/milestones:
    post:
      tags:
      - Learning
      summary: Add a milestone to a card
      operationId: createLearningMilestone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningMilestoneCreate"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningMilestone"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningMilestone"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LearningMilestone"
  /api/habits:
    get:
      tags:
      - Habits
      summary: List habits
      operationId: listHabits
      parameters:
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Habits
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      tags:
      - Habits
      summary: Create a habit
      operationId: createHabit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitCreate"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Habit"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Habit"
  /api/habits/{id}/completions:
    get:
      tags:
      - Habits
      summary: List completions of a habit
      operationId: listHabitCompletions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: "Completions, newest first"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitCompletion"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitCompletion"
    post:
      tags:
      - Habits
      summary: Mark a habit complete for a date
      description: "400 for a future date or an inactive habit. 409 if that habit\
        \ already has a completion on that date (BR7), or, for a WEEKLY habit, in\
        \ that Monday-Sunday week."
      operationId: completeHabit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitCompletionCreate"
      responses:
        "201":
          description: Recorded
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitCompletion"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitCompletion"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitCompletion"
        "409":
          description: Already completed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HabitCompletion"
  /api/learning-cards/{id}/notes/{noteId}:
    delete:
      tags:
      - Learning
      summary: Remove a note
      operationId: deleteLearningNote
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: noteId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /api/habits/{id}/completions/{date}:
    delete:
      tags:
      - Habits
      summary: Remove the completion of a date (undo)
      operationId: deleteHabitCompletion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
components:
  schemas:
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        status:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        dueDate:
          type: string
          format: date
      required:
      - title
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        dueDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archived:
          type: boolean
        overdue:
          type: boolean
    SettingsUpdate:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        timeZone:
          type: string
        notificationsEnabled:
          type: boolean
        defaultStartPage:
          type: string
          enum:
          - DASHBOARD
          - TASKS
          - HABITS
          - LEARNING
          - PLANS
    Settings:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        timeZone:
          type: string
        notificationsEnabled:
          type: boolean
        defaultStartPage:
          type: string
          enum:
          - DASHBOARD
          - TASKS
          - HABITS
          - LEARNING
          - PLANS
        configured:
          type: boolean
    LearningCardUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        status:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
      required:
      - title
    LearningCard:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
        createdAt:
          type: string
          format: date-time
        milestones:
          type: array
          items:
            $ref: "#/components/schemas/LearningMilestone"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/LearningNote"
    LearningMilestone:
      type: object
      properties:
        id:
          type: integer
          format: int64
        learningCardId:
          type: integer
          format: int64
        title:
          type: string
        done:
          type: boolean
        targetDate:
          type: string
          format: date
        completedAt:
          type: string
          format: date-time
    LearningNote:
      type: object
      properties:
        id:
          type: integer
          format: int64
        learningCardId:
          type: integer
          format: int64
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    LearningMilestoneUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        done:
          type: boolean
        targetDate:
          type: string
          format: date
      required:
      - done
      - title
    HabitUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
        active:
          type: boolean
      required:
      - active
      - frequency
      - name
    Habit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
        createdAt:
          type: string
          format: date-time
        active:
          type: boolean
        doneForCurrentPeriod:
          type: boolean
        currentStreak:
          type: integer
          format: int32
        totalCompletions:
          type: integer
          format: int32
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
    TaskCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        status:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        dueDate:
          type: string
          format: date
      required:
      - title
    LearningCardCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        status:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
      required:
      - title
    LearningNoteCreate:
      type: object
      properties:
        text:
          type: string
          maxLength: 4000
          minLength: 0
      required:
      - text
    LearningMilestoneCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        targetDate:
          type: string
          format: date
      required:
      - title
    HabitCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
      required:
      - frequency
      - name
    HabitCompletionCreate:
      type: object
      properties:
        completionDate:
          type: string
          format: date
    HabitCompletion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        habitId:
          type: integer
          format: int64
        completionDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
