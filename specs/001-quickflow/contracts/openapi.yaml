# QuickFlow API contract (full API). Generated once during planning; edited only by the user/verifier. x-milestone = milestone that delivers the operation.
openapi: 3.0.3
info:
  title: QuickFlow API
  version: 1.0.0
  description: Contract for spec 001-quickflow. Single user, no authentication. Dates are yyyy-MM-dd in the user time zone; date-times are UTC
    (ISO-8601 with Z). Lists are not paginated. All errors use ApiError.
servers:
- url: http://localhost:8090
  description: stable backend
tags:
- name: Settings
- name: Tasks
- name: Habits
- name: Learning
- name: Plans
- name: Dashboard
paths:
  /api/settings:
    get:
      x-milestone: M01
      tags:
      - Settings
      summary: Get the settings of the single user
      operationId: getSettings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
              examples:
                default:
                  $ref: '#/components/examples/Settings'
    put:
      x-milestone: M01
      tags:
      - Settings
      summary: Replace the settings
      operationId: updateSettings
      description: Invalid time zone ids and unknown start pages are rejected with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
            example:
              displayName: Alex
              email: alex@example.com
              timeZone: Europe/Berlin
              notificationsEnabled: true
              defaultStartPage: DASHBOARD
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
              examples:
                default:
                  $ref: '#/components/examples/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/tasks:
    get:
      x-milestone: M02
      tags:
      - Tasks
      summary: List tasks
      operationId: listTasks
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive partial match on the title.
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TaskStatus'
      - name: priority
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TaskPriority'
      - name: due
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TaskDueFilter'
      - name: dueFrom
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inclusive; combinable with dueTo.
      - name: dueTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: false (default) = non-archived tasks only (BR4); true = archived tasks only.
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TaskSort'
      responses:
        '200':
          description: Tasks (not paginated)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
              examples:
                default:
                  $ref: '#/components/examples/TaskList'
    post:
      x-milestone: M02
      tags:
      - Tasks
      summary: Create a task
      operationId: createTask
      description: 'Defaults: status TODO, priority MEDIUM.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
            example:
              title: Write quarterly report
              description: Draft the report
              priority: HIGH
              dueDate: '2026-10-20'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                default:
                  $ref: '#/components/examples/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/tasks/{id}:
    get:
      x-milestone: M02
      tags:
      - Tasks
      summary: Get a task
      operationId: getTask
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                default:
                  $ref: '#/components/examples/Task'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      x-milestone: M02
      tags:
      - Tasks
      summary: Update a task
      operationId: updateTask
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                default:
                  $ref: '#/components/examples/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      x-milestone: M02
      tags:
      - Tasks
      summary: Delete a task for good
      operationId: deleteTask
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Deleted (also removed from plans)
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tasks/{id}/complete:
    post:
      x-milestone: M02
      tags:
      - Tasks
      summary: Mark a task completed (status DONE)
      operationId: completeTask
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                default:
                  $ref: '#/components/examples/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tasks/{id}/archive:
    post:
      x-milestone: M02
      tags:
      - Tasks
      summary: Archive a task
      operationId: archiveTask
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                default:
                  $ref: '#/components/examples/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tasks/{id}/restore:
    post:
      x-milestone: M02
      tags:
      - Tasks
      summary: Restore an archived task
      operationId: restoreTask
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                default:
                  $ref: '#/components/examples/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/habits:
    get:
      x-milestone: M03
      tags:
      - Habits
      summary: List habits
      operationId: listHabits
      parameters:
      - name: active
        in: query
        required: false
        schema:
          type: boolean
        description: Filter by IsActive; omit for all.
      responses:
        '200':
          description: Habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Habit'
              examples:
                default:
                  $ref: '#/components/examples/HabitList'
    post:
      x-milestone: M03
      tags:
      - Habits
      summary: Create a habit
      operationId: createHabit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
              examples:
                default:
                  $ref: '#/components/examples/Habit'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/habits/{id}:
    get:
      x-milestone: M03
      tags:
      - Habits
      summary: Get a habit
      operationId: getHabit
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Habit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
              examples:
                default:
                  $ref: '#/components/examples/Habit'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      x-milestone: M03
      tags:
      - Habits
      summary: Update or (de)activate a habit
      operationId: updateHabit
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
              examples:
                default:
                  $ref: '#/components/examples/Habit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      x-milestone: M03
      tags:
      - Habits
      summary: Delete a habit and its completions
      operationId: deleteHabit
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Deleted (also removed from plans)
        '404':
          $ref: '#/components/responses/NotFound'
  /api/habits/{id}/completions:
    get:
      x-milestone: M03
      tags:
      - Habits
      summary: List completions of a habit
      operationId: listHabitCompletions
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Completions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HabitCompletion'
              examples:
                default:
                  $ref: '#/components/examples/HabitCompletionList'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      x-milestone: M03
      tags:
      - Habits
      summary: Mark a habit complete for a date
      operationId: completeHabit
      description: 400 for a future date or an inactive habit. 409 if that habit already has a completion on that date (BR7), or, for a WEEKLY
        habit, in that Monday-Sunday week.
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitCompletionCreate'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabitCompletion'
              examples:
                default:
                  $ref: '#/components/examples/HabitCompletion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/habits/{id}/completions/{date}:
    delete:
      x-milestone: M03
      tags:
      - Habits
      summary: Remove the completion of a date (undo)
      operationId: deleteHabitCompletion
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      - name: date
        in: path
        required: true
        description: Completion date (yyyy-MM-dd)
        schema:
          type: string
          format: date
      responses:
        '204':
          description: Removed
        '404':
          $ref: '#/components/responses/NotFound'
  /api/learning-cards:
    get:
      x-milestone: M04
      tags:
      - Learning
      summary: List learning cards with milestones and notes
      operationId: listLearningCards
      responses:
        '200':
          description: Cards, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearningCard'
              examples:
                default:
                  $ref: '#/components/examples/LearningCardList'
    post:
      x-milestone: M04
      tags:
      - Learning
      summary: Add a learning card
      operationId: createLearningCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningCardCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningCard'
              examples:
                default:
                  $ref: '#/components/examples/LearningCard'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/learning-cards/{id}:
    get:
      x-milestone: M04
      tags:
      - Learning
      summary: Get a learning card
      operationId: getLearningCard
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningCard'
              examples:
                default:
                  $ref: '#/components/examples/LearningCard'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      x-milestone: M04
      tags:
      - Learning
      summary: Update a learning card
      operationId: updateLearningCard
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningCardUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningCard'
              examples:
                default:
                  $ref: '#/components/examples/LearningCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      x-milestone: M04
      tags:
      - Learning
      summary: Remove a learning card with its milestones and notes
      operationId: deleteLearningCard
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Deleted (also removed from plans)
        '404':
          $ref: '#/components/responses/NotFound'
  /api/learning-cards/{id}/milestones:
    post:
      x-milestone: M04
      tags:
      - Learning
      summary: Add a milestone to a card
      operationId: createLearningMilestone
      parameters:
      - name: id
        in: path
        required: true
        description: Learning card id
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningMilestoneCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningMilestone'
              examples:
                default:
                  $ref: '#/components/examples/LearningMilestoneNew'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/learning-cards/{id}/milestones/{milestoneId}:
    put:
      x-milestone: M04
      tags:
      - Learning
      summary: Update or complete a milestone
      operationId: updateLearningMilestone
      parameters:
      - name: id
        in: path
        required: true
        description: Learning card id
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        description: Milestone id
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningMilestoneUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningMilestone'
              examples:
                default:
                  $ref: '#/components/examples/LearningMilestone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      x-milestone: M04
      tags:
      - Learning
      summary: Remove a milestone
      operationId: deleteLearningMilestone
      parameters:
      - name: id
        in: path
        required: true
        description: Learning card id
        schema:
          type: integer
          format: int64
      - name: milestoneId
        in: path
        required: true
        description: Milestone id
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/learning-cards/{id}/notes:
    post:
      x-milestone: M04
      tags:
      - Learning
      summary: Add a note to a card
      operationId: createLearningNote
      parameters:
      - name: id
        in: path
        required: true
        description: Learning card id
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningNoteCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningNote'
              examples:
                default:
                  $ref: '#/components/examples/LearningNote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/learning-cards/{id}/notes/{noteId}:
    delete:
      x-milestone: M04
      tags:
      - Learning
      summary: Remove a note
      operationId: deleteLearningNote
      parameters:
      - name: id
        in: path
        required: true
        description: Learning card id
        schema:
          type: integer
          format: int64
      - name: noteId
        in: path
        required: true
        description: Note id
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/plans:
    get:
      x-milestone: M05
      tags:
      - Plans
      summary: List plans ordered by priorityOrder, then start
      operationId: listPlans
      parameters:
      - name: group
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PlanGroup'
        description: Omit for all plans.
      responses:
        '200':
          description: Plans (not paginated)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
              examples:
                default:
                  $ref: '#/components/examples/PlanList'
    post:
      x-milestone: M05
      tags:
      - Plans
      summary: Create a plan from existing tasks, habits and learning cards
      operationId: createPlan
      description: 400 when there are no items (BR10), end is not after start (BR11), a source does not exist, an item is duplicated, or the duration
        is not positive. A duration longer than the window is accepted (durationExceedsWindow=true).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreate'
            example:
              title: Focused morning
              estimatedDurationMinutes: 90
              startDateTime: '2026-10-15T09:00:00Z'
              endDateTime: '2026-10-15T11:00:00Z'
              priorityOrder: 1
              items:
              - sourceType: TASK
                sourceId: 1
              - sourceType: HABIT
                sourceId: 1
              - sourceType: LEARNING_RESOURCE
                sourceId: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                default:
                  $ref: '#/components/examples/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/plans/{id}:
    get:
      x-milestone: M05
      tags:
      - Plans
      summary: Get a plan
      operationId: getPlan
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                default:
                  $ref: '#/components/examples/Plan'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      x-milestone: M05
      tags:
      - Plans
      summary: Remove a plan (sources are untouched)
      operationId: deletePlan
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/plans/{id}/items/{itemId}:
    put:
      x-milestone: M05
      tags:
      - Plans
      summary: Mark a plan item done or not done
      operationId: updatePlanItem
      description: TASK items also set the task to DONE (done=true) or TODO (done=false). HABIT and LEARNING_RESOURCE items only change the item
        flag.
      parameters:
      - name: id
        in: path
        required: true
        description: Plan id
        schema:
          type: integer
          format: int64
      - name: itemId
        in: path
        required: true
        description: Plan item id
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanItemUpdate'
      responses:
        '200':
          description: The whole plan with recomputed progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                default:
                  $ref: '#/components/examples/Plan'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/plans/{id}/acknowledge-start:
    post:
      x-milestone: M05
      tags:
      - Plans
      summary: Record that the start notice was shown
      operationId: acknowledgePlanStart
      description: Idempotent. Used for the one-time catch-up notice when a plan started while the app was closed.
      parameters:
      - name: id
        in: path
        required: true
        description: Resource id
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Plan with startNotified=true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              examples:
                default:
                  $ref: '#/components/examples/Plan'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/dashboard:
    get:
      x-milestone: M06
      tags:
      - Dashboard
      summary: Dashboard aggregate for today
      operationId: getDashboard
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
              examples:
                default:
                  $ref: '#/components/examples/Dashboard'
components:
  schemas:
    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - timestamp
      - status
      - error
      - message
      - path
      - fieldErrors
      description: Error body of every 4xx/5xx response.
      example:
        timestamp: '2026-10-15T09:00:00Z'
        status: 400
        error: Bad Request
        message: Validation failed
        path: /api/tasks
        fieldErrors:
        - field: title
          message: must not be blank
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    TaskStatus:
      type: string
      enum:
      - TODO
      - IN_PROGRESS
      - DONE
    TaskPriority:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
    TaskDueFilter:
      type: string
      enum:
      - TODAY
      - OVERDUE
      - THIS_WEEK
      - NO_DUE_DATE
      description: THIS_WEEK = Monday-Sunday of the current week in the user time zone.
    TaskSort:
      type: string
      enum:
      - CREATED_DESC
      - CREATED_ASC
      - DUE_DATE_ASC
      - DUE_DATE_DESC
      description: Default CREATED_DESC. Tasks without a due date sort last for DUE_DATE_*.
    HabitFrequency:
      type: string
      enum:
      - DAILY
      - WEEKLY
    LearningStatus:
      type: string
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - COMPLETED
    PlanStatus:
      type: string
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - COMPLETED
    PlanGroup:
      type: string
      enum:
      - ACTIVE_UPCOMING
      - COMPLETED
      description: ACTIVE_UPCOMING = NOT_STARTED + IN_PROGRESS.
    PlanItemSourceType:
      type: string
      enum:
      - TASK
      - HABIT
      - LEARNING_RESOURCE
    StartPage:
      type: string
      enum:
      - DASHBOARD
      - TASKS
      - HABITS
      - LEARNING
      - PLANS
    Settings:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 200
          nullable: true
        timeZone:
          type: string
          description: IANA zone id, e.g. Europe/Berlin
        notificationsEnabled:
          type: boolean
        defaultStartPage:
          $ref: '#/components/schemas/StartPage'
        configured:
          type: boolean
          description: false until the first PUT; the frontend then saves the browser time zone silently.
      required:
      - displayName
      - timeZone
      - notificationsEnabled
      - defaultStartPage
      - configured
      example:
        displayName: Alex
        email: alex@example.com
        timeZone: Europe/Berlin
        notificationsEnabled: true
        defaultStartPage: DASHBOARD
        configured: true
    SettingsUpdate:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 200
          format: email
          nullable: true
        timeZone:
          type: string
        notificationsEnabled:
          type: boolean
        defaultStartPage:
          $ref: '#/components/schemas/StartPage'
      required:
      - displayName
      - timeZone
      - notificationsEnabled
      - defaultStartPage
      example:
        displayName: Alex
        email: alex@example.com
        timeZone: Europe/Berlin
        notificationsEnabled: true
        defaultStartPage: DASHBOARD
    Task:
      type: object
      properties:
