        dueDate:
          type: string
          format: date
          nullable: true
      required:
      - title
      example:
        title: Write quarterly report
        description: Draft the report
        priority: HIGH
        dueDate: '2026-10-20'
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date
          nullable: true
      required:
      - title
      description: Full replacement. Missing status/priority keep their current value; missing description/dueDate clear them.
    Habit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 150
        description:
          type: string
