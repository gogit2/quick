        done:
          type: boolean
      required:
      - id
      - sourceType
      - sourceId
      - title
      - done
    Plan:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 200
        estimatedDurationMinutes:
          type: integer
          minimum: 1
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        priorityOrder:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/PlanStatus'
        createdAt:
          type: string
          format: date-time
        startNotified:
          type: boolean
          description: true once the start notice was acknowledged (POST .../acknowledge-start).
        durationExceedsWindow:
          type: boolean
          description: estimated duration is longer than end minus start (warning only).
        totalItems:
          type: integer
        doneItems:
          type: integer
        completionPercent:
          type: integer
          description: round-half-up of doneItems*100/totalItems
        restSeconds:
          type: integer
          description: Seconds until endDateTime, only while status is IN_PROGRESS (BR12); null otherwise.
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanItem'
      required:
      - id
      - title
      - estimatedDurationMinutes
      - startDateTime
      - endDateTime
      - priorityOrder
      - status
      - createdAt
      - startNotified
      - durationExceedsWindow
      - totalItems
      - doneItems
      - completionPercent
      - items
      description: 'status is computed on every read from the clock and item completion, never stored: COMPLETED if all items are done or now
        >= end; else IN_PROGRESS if now >= start; else NOT_STARTED.'
    PlanItemCreate:
      type: object
      properties:
        sourceType:
          $ref: '#/components/schemas/PlanItemSourceType'
        sourceId:
          type: integer
          format: int64
      required:
      - sourceType
      - sourceId
    PlanCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        estimatedDurationMinutes:
          type: integer
          minimum: 1
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        priorityOrder:
          type: integer
          minimum: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlanItemCreate'
      required:
      - title
      - estimatedDurationMinutes
      - startDateTime
      - endDateTime
      - priorityOrder
      - items
      example:
        title: Focused morning
        estimatedDurationMinutes: 90
        startDateTime: '2026-10-15T09:00:00Z'
        endDateTime: '2026-10-15T11:00:00Z'
        priorityOrder: 1
        items:
        - sourceType: TASK
          sourceId: 1
        - sourceType: HABIT
          sourceId: 1
        - sourceType: LEARNING_RESOURCE
          sourceId: 1
