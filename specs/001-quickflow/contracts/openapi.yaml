        createdAt:
          type: string
          format: date-time
        active:
          type: boolean
        doneForCurrentPeriod:
          type: boolean
          description: 'DAILY: completed today. WEEKLY: completed on any day of the current Monday-Sunday week.'
        currentStreak:
          type: integer
          description: Consecutive completed days (DAILY) or weeks (WEEKLY) ending at the current period; an unfinished current period does not
            break it.
        totalCompletions:
          type: integer
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
      required:
      - id
      - name
      - frequency
      - createdAt
      - active
      - doneForCurrentPeriod
      - currentStreak
      - totalCompletions
      - periodStart
      - periodEnd
    HabitCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 2000
          nullable: true
