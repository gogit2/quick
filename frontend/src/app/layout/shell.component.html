<mat-toolbar color="primary" class="toolbar">
  <span>QuickFlow</span>
  <app-theme-toggle />
</mat-toolbar>

@if (notifications.banner(); as notice) {
  <div class="start-banner" role="status" data-testid="plans-start-banner">
    <span>Plan {{ notice.title }} has started</span>
    <button mat-button type="button" data-testid="plans-start-banner-dismiss" (click)="notifications.dismiss()">
      Dismiss
    </button>
  </div>
}

<mat-sidenav-container class="container">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-nav-list aria-label="Main navigation">
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [attr.data-testid]="item.testId"
        >
          {{ item.label }}
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
